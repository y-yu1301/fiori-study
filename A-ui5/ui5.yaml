# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: project1
type: application
builder:
  customTasks:
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion
      configuration:
        transformTypeScript: true
        transformModulesToUI5:
          overridesToOverride: true
        omitTSFromBuildResult: true
server:
  settings:
    httpPort: 8082
  customMiddleware:
    - name: ui5-tooling-transpile-middleware
      afterMiddleware: compression
      configuration:
        transformTypeScript: true
        transformModulesToUI5:
          overridesToOverride: true
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertErrors: false # If set to true, certificate errors will be ignored. E.g. self-signed certificates will be accepted
        # ★独立サーバ型の要：/odata を、別プロジェクトのバックエンド A-cap(4004) へ転送。
        #   このUI5(A-ui5)は CAP のファイルを一切参照せず、実行時に OData(HTTP) だけで接続する。
        #   これが現場の「フロントとバックは別リポジトリ、HTTPで疎結合」を再現した形。
        #   本番では、この proxy の代わりに destination/approuter が同じ役割を担う。
        backend:
          - path: /odata
            url: http://localhost:4004
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://sapui5.hana.ondemand.com
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
