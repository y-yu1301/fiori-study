<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>F Retry Edit</title>
    <style>html, body, body > div, #container, #container-uiarea { height: 100%; }</style>
    <script>
      // FはFLP/LREPを持たないローカル直接起動なので、Personalizationの保存先を
      // UI5のLocalStorageConnectorへ明示的に切り替えます。
      // bootstrap属性だけに依存せず、Core読込前のグローバル設定として渡します。
      window["sap-ui-config"] = {
        flexibilityServices: [{ connector: "LocalStorageConnector" }]
      };
    </script>
    <script
      id="sap-ui-bootstrap"
      src="https://sapui5.hana.ondemand.com/1.149.1/resources/sap-ui-core.js"
      data-sap-ui-theme="sap_horizon"
      data-sap-ui-resource-roots='{"f.retry.edit.ui":"./"}'
      data-sap-ui-on-init="module:sap/ui/core/ComponentSupport"
      data-sap-ui-compat-version="edge"
      data-sap-ui-async="true"
      data-sap-ui-flexibilityServices='[{"connector":"LocalStorageConnector"}]'
      data-sap-ui-xx-componentPreload="off"
      data-sap-ui-frame-options="trusted">
    </script>
  </head>
  <body class="sapUiBody sapUiSizeCompact" id="content">
    <div data-sap-ui-component data-name="f.retry.edit.ui" data-id="container"
      data-settings='{"id":"f.retry.edit.ui"}' data-handle-validation="true"></div>
  </body>
</html>
