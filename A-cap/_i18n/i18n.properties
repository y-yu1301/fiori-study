# =============================================================================
# _i18n/i18n.properties  ―  翻訳テキストの「既定（フォールバック）」
# -----------------------------------------------------------------------------
# ★これが i18n の「元ファイル(source)」です。人が編集するのはこのファイル群。
#   cds build --for java が、この _i18n/ 内の .properties を全部集約して
#   srv/src/main/resources/edmx/_i18n/i18n.json（自動生成物）にまとめ、
#   CAP Java が実行時にリクエストの言語に応じて翻訳を返します。
#
# ・このファイル(i18n.properties)は言語指定なし＝どの言語にも一致しない時の既定。
#   ここでは中立的に英語を入れています。
# ・i18n_ja.properties が日本語、i18n_en.properties が英語。
# ・.properties は CAP により UTF-8 として読まれるので日本語も直接書けます
#   （\uXXXX エスケープ不要）。
#
# .cds 側では {i18n>book_title} のように、このキーを参照します。
# =============================================================================

book_title=Title
book_author=Author
book_stock=Stock
book_price=Price
book_availableDate=Available Date
facet_schedules=Schedules
schedule_businessDate=Business Date
schedule_quantity=Quantity
schedule_note=Note
book_descr=Description
book_relatedMovie=Related Movie
book_typeName=Book
book_typeNamePlural=Books
facet_details=Details
